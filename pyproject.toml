[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cbg-design-opensource"
version = "0.1.0"
description = "Open-source conceptual sizing tools for a Compressed Biogas (CBG) plant under India's SATAT scheme (feedstock, anaerobic digestion, upgrading, compression/storage, digestate)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "CoolProp>=6.6",
    "streamlit>=1.32",
    "plotly>=5.20",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["cbg_design*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E701"]
